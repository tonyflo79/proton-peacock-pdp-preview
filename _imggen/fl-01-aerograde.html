<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>:root{--pk-teal:#FF6FA5;--pk-blue:#E84393;--pk-purp:#C0399B;}</style>
</head><body>
<div class="stage">
  <img class="paddle shift-up" src="src/fl-front.png" alt="">

  <!-- leader lines: label-anchor -> paddle-anchor (coords in px on 2048 canvas) -->
  <svg class="leads" viewBox="0 0 2048 2048">
    <!-- Roughness Enhanced -> upper-left face -->
    <line x1="600" y1="360" x2="835" y2="440"/><circle cx="835" cy="440" r="6"/>
    <!-- Velocity Foam Core -> left-mid face -->
    <line x1="600" y1="700" x2="800" y2="770"/><circle cx="800" cy="770" r="6"/>
    <!-- Polypropylene Honeycomb -> handle -->
    <line x1="600" y1="1090" x2="980" y2="1360"/><circle cx="980" cy="1360" r="6"/>
    <!-- Aerospace Grade Carbon Fiber Face -> upper-right face -->
    <line x1="1448" y1="420" x2="1230" y2="450"/><circle cx="1230" cy="450" r="6"/>
    <!-- Dual-Stamped Approval -> throat stamp -->
    <line x1="1448" y1="800" x2="1030" y2="1085"/><circle cx="1030" cy="1085" r="6"/>
  </svg>

  <div class="lab"   style="left:120px; top:330px; width:470px;">Roughness Enhanced</div>
  <div class="lab"   style="left:120px; top:668px; width:470px;">Velocity Foam Core</div>
  <div class="lab"   style="left:120px; top:1010px; width:470px;">Polypropylene<br>Honeycomb</div>
  <div class="lab r" style="right:120px; top:378px; width:470px;">Aerospace Grade<br>Carbon Fiber Face</div>
  <div class="lab r" style="right:120px; top:760px; width:470px;">Dual-Stamped<br>Approval</div>

  <div class="title hero">
    <h1>AEROGRADE CONSTRUCTION&trade;</h1>
    <div class="sub">Built for Pop &amp; Feel.</div>
  </div>
</div>
</body></html>
