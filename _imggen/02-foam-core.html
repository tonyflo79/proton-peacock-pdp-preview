<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>.core-plate{position:absolute;left:0;top:0;width:2048px;height:2048px;
  filter:drop-shadow(0 46px 60px rgba(20,26,40,.18));}
  .stage .lab{text-transform:uppercase;font-weight:600;font-size:40px;line-height:1.18;letter-spacing:0.005em;}</style>
</head><body>
<div class="stage">
  <img class="core-plate" src="src/core-cutaway-plate.png" alt="">

  <!-- fresh leader lines: label -> core feature -->
  <svg class="leads" viewBox="0 0 2048 2048">
    <!-- Foam-Injected Edge Guard -> gold edge, top-left -->
    <line x1="590" y1="330" x2="688" y2="238"/><circle cx="688" cy="238" r="7"/>
    <!-- Elastic EVA Foam Perimeter -> white perimeter band -->
    <line x1="590" y1="520" x2="704" y2="470"/><circle cx="704" cy="470" r="7"/>
    <!-- High-Density Atomic Foam Core -> foam-cell texture -->
    <line x1="590" y1="720" x2="905" y2="690"/><circle cx="905" cy="690" r="7"/>
    <!-- Foam Through the Handle -> handle -->
    <line x1="590" y1="1430" x2="1006" y2="1440"/><circle cx="1006" cy="1440" r="7"/>
  </svg>

  <div class="lab" style="left:120px; top:290px;  width:495px;">Foam-Injected Edge<br>Guard</div>
  <div class="lab" style="left:120px; top:478px;  width:495px;">Elastic EVA Foam<br>Perimeter</div>
  <div class="lab" style="left:120px; top:680px;  width:495px;">High-Density Atomic<br>Foam Core</div>
  <div class="lab" style="left:120px; top:1388px; width:495px;">Foam Through the<br>Handle</div>

  <div class="title hero">
    <h1>HIGH-DENSITY ATOMIC FOAM CORE</h1>
    <div class="sub">Dense. Consistent. Built for Extra Durability.</div>
  </div>
</div>
</body></html>
