<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>:root{--pk-teal:#3E7BF0;--pk-blue:#2F6FE0;--pk-purp:#1E4FB8;}
  .corelab{position:absolute;font-family:var(--ff-b);font-weight:700;font-size:38px;
    letter-spacing:0.01em;text-align:center;padding:8px 18px;border-radius:999px;
    background:rgba(255,255,255,.82);}
  .corelab small{display:block;font-weight:600;font-size:26px;letter-spacing:0.08em;
    text-transform:uppercase;margin-top:2px;}
</style>
</head><body>
<div class="stage">
  <img class="paddle" src="src/rr-front.png" alt="" style="left:26.5%;top:37%;height:1180px;transform:translate(-50%,-50%);">

  <!-- source marker over the core (mid paddle body) -->
  <div class="loupe-ring" style="left:452px;top:600px;width:150px;height:150px;"></div>

  <!-- hybrid honeycomb core panel on the right -->
  <div class="loupe" style="left:1120px;top:440px;width:780px;height:780px;border-radius:28px;">
    <img src="src/rr-core-hex.png" alt="">
  </div>

  <!-- core labels over each honeycomb half -->
  <div class="corelab" style="left:1170px;top:498px;color:#8A5A18;">NOMEX<small>Power</small></div>
  <div class="corelab" style="left:1512px;top:498px;color:#2453C0;">POLYPROPYLENE<small>Touch</small></div>

  <!-- zoom cone: marker corners -> panel corners -->
  <svg class="leads" viewBox="0 0 2048 2048">
    <line x1="602" y1="600" x2="1120" y2="440"/>
    <line x1="602" y1="750" x2="1120" y2="1220"/>
  </svg>

  <div class="title">
    <h1>TOUCH-POWER HYBRID CORE</h1>
    <div class="sub">Nomex + Polypropylene · Touch + Power</div>
  </div>
</div>
</body></html>
